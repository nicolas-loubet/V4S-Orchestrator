<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}V4S-Orchestrator{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        surface: {
                            900: '#0a0e17',
                            800: '#0f1520',
                            700: '#151d2e',
                            600: '#1c2740',
                        },
                        accent: {
                            DEFAULT: '#38bdf8',
                            dim:     '#0ea5e9',
                            glow:    '#7dd3fc',
                        },
                        border: {
                            dim: '#1e2d45',
                        }
                    },
                    fontFamily: {
                        mono: ['"JetBrains Mono"', 'monospace'],
                        sans: ['"DM Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

    <style>
        html, body { height: 100%; background-color: #0a0e17; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f1520; }
        ::-webkit-scrollbar-thumb { background: #1e2d45; border-radius: 3px; }

        .tab-btn.active {
            color: #38bdf8;
            border-bottom-color: #38bdf8;
        }
        .tab-btn.active span.tab-dot {
            background-color: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
        }

        #tab-content.htmx-request { opacity: 0.4; transition: opacity 0.15s ease; }
        #tab-content               { opacity: 1;   transition: opacity 0.2s ease; }

        .bg-grid {
            background-image:
                linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
    </style>
</head>
<body class="font-sans text-slate-300 bg-surface-900 bg-grid min-h-screen flex flex-col">

    <header class="border-b border-border-dim bg-surface-800/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 flex items-center justify-between h-14">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-accent animate-pulse"></div>
                <span class="font-mono text-sm font-bold tracking-widest text-accent uppercase">
                    V4S<span class="text-slate-500">-</span>Orchestrator
                </span>
            </div>
            <span class="font-mono text-xs text-slate-500 bg-surface-700 px-3 py-1 rounded-full border border-border-dim">
                local · FastAPI
            </span>
        </div>
    </header>

    <nav class="border-b border-border-dim bg-surface-800/60 sticky top-14 z-40 backdrop-blur-sm">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex items-center gap-1 overflow-x-auto">

                <button
                    class="tab-btn active flex items-center gap-2 px-4 py-3 font-mono text-xs font-medium
                           text-slate-400 border-b-2 border-transparent
                           hover:text-accent transition-colors duration-150 whitespace-nowrap"
                    hx-get="/tabs/sistema"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                    onclick="setActive(this)"
                >
                    <span class="tab-dot w-1.5 h-1.5 rounded-full bg-slate-600 transition-all duration-150"></span>
                    Sistema
                </button>

                <button
                    id="nav-calculo-btn"
                    class="tab-btn flex items-center gap-2 px-4 py-3 font-mono text-xs font-medium
                           text-slate-600 border-b-2 border-transparent
                           transition-colors duration-150 whitespace-nowrap
                           cursor-not-allowed opacity-40"
                    disabled
                    onclick="window.navToCalculo(this)"
                >
                    <span class="tab-dot w-1.5 h-1.5 rounded-full bg-slate-700 transition-all duration-150"></span>
                    Cálculo
                </button>

                <button
                    class="tab-btn flex items-center gap-2 px-4 py-3 font-mono text-xs font-medium
                           text-slate-400 border-b-2 border-transparent
                           hover:text-accent transition-colors duration-150 whitespace-nowrap"
                    hx-get="/tabs/visualizacion"
                    hx-target="#tab-content"
                    hx-swap="innerHTML"
                    onclick="setActive(this)"
                >
                    <span class="tab-dot w-1.5 h-1.5 rounded-full bg-slate-600 transition-all duration-150"></span>
                    Visualización
                </button>

            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6">
        <div id="tab-content">
            {% block tab_content %}{% endblock %}
        </div>
    </main>

    <footer class="border-t border-border-dim py-3 px-4">
        <p class="text-center font-mono text-xs text-slate-600">
            V4S-Orchestrator &mdash; GROMACS simulation controller &amp; V4S calculator
        </p>
    </footer>

    <!-- Three.js: cargado globalmente para que los tabs lo encuentren disponible -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        window._activeSistemaId = null;

        function setActive(el) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
        }

        function enableCalculoTab(sistemaId) {
            window._activeSistemaId = sistemaId;
            const btn = document.getElementById('nav-calculo-btn');
            btn.disabled = false;
            btn.classList.remove('cursor-not-allowed', 'opacity-40', 'text-slate-600');
            btn.classList.add('hover:text-accent', 'text-slate-400');
        }

        // Persistencia de estado del tab Calculo
        document.body.addEventListener('htmx:beforeSwap', function(evt) {
            if (evt.detail.target && evt.detail.target.id === 'tab-content') {
                if (window.v4s && typeof window.v4s.saveFormState === 'function') {
                    window.v4s.saveFormState();
                }
                if (window.viz && typeof window.viz.saveVizState === 'function') {
                    window.viz.saveVizState();
                }
            }
        });

        function navToCalculo(el) {
            if (!window._activeSistemaId) return;
            setActive(el);
            htmx.ajax('GET',
                '/tabs/calculo?sistema=' + window._activeSistemaId,
                '#tab-content'
            );
        }
    </script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
